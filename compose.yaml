name: boilerplate-e2e
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Defina SQLSERVER_SA_PASSWORD no .env ou ambiente}
    ports: ["127.0.0.1:14333:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  wiremock:
    image: sheyenrath/wiremock.net:latest
    ports: ["127.0.0.1:9090:80"]
    command: ["--Urls", "http://*:80", "--ReadStaticMappings", "true"]
    volumes:
      - ./samples/wiremock/mappings:/app/__admin/mappings:ro
  api:
    build:
      context: .
      dockerfile: samples/ReferenceApi/Dockerfile
    environment:
      CatalogBaseUrl: http://wiremock:80
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=BoilerplateE2E;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5
      ConnectionStrings__Redis: redis:6379
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
      wiremock: { condition: service_started }
